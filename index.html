<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Campaign | CDN Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#10243A; --mist:#E6EDF3; --sun:#F2B134; --paper:#FFFFFF; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--mist); color:var(--ink);
           font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.55; }
    main { max-width:980px; margin:0 auto; padding:4rem 1.5rem; display:grid; gap:3rem;
           grid-template-columns:1.1fr 1fr; align-items:center; }
    h1 { font-size:clamp(2.4rem,6vw,4.2rem); line-height:1.02; font-weight:800; margin:0 0 1.25rem; letter-spacing:-.02em; }
    p.lead { font-size:1.15rem; max-width:34ch; margin:0 0 2rem; }
    .photo { position:relative; }
    .photo::before { content:""; position:absolute; inset:14px -14px -14px 14px; background:var(--sun); border-radius:10px; }
    .photo img { position:relative; display:block; width:100%; border-radius:10px; }
    .card { background:var(--ink); color:var(--paper); border-radius:10px; padding:1.1rem 1.4rem; max-width:34ch; }
    .card dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:.35rem 1rem; font-size:.95rem; }
    .card dt { color:var(--sun); font-weight:500; }
    .card dd { margin:0; }
    @media (max-width:760px) { main { grid-template-columns:1fr; padding:2.5rem 1.25rem; } }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Spring Campaign Is Live</h1>
      <p class="lead">Fresh offers for the season, delivered fast from the server nearest to you.</p>
      <div class="card">
        <dl>
          <dt>Name</dt><dd>YOUR FULL NAME HERE</dd>
          <dt>Deployed</dt><dd>YYYY-MM-DD HH:MM</dd>
          <dt>Page loaded</dt><dd id="now"></dd>
        </dl>
      </div>
    </section>
    <div class="photo">
      <img src="https://picsum.photos/id/1015/800/900" alt="Scenic river valley in spring">
    </div>
  </main>
  <script>document.getElementById("now").textContent = new Date().toLocaleString();</script>
</body>
</html>
